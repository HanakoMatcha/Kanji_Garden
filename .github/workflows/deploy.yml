name: Actualizar y Desplegar Jardín

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clonar motor de Quartz si falta package.json
        run: |
          if [ ! -f "package.json" ]; then
            echo "package.json no detectado. Obteniendo motor de Quartz..."
            git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
            shopt -s dotglob
            cp -r quartz-engine/* .
            rm -rf quartz-engine
          fi

      - name: Instalar dependencias del proyecto
        run: |
          npm ci || npm install
          npm install csv-parse

      - name: Limpiar contenido previo para modo test
        run: |
          rm -rf content/*
          rm -rf public
          rm -rf .quartz-cache

      - name: Descargar de Sheets y generar Markdown
        run: node build_test.js

      - name: Compilar Quartz
        run: npx quartz build

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
