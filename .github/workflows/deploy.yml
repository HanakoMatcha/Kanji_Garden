name: Actualizar y Desplegar Jardín

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar tu repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clonar motor de Quartz e instalar dependencias
        run: |
          # Clonar Quartz oficial en una carpeta temporal 'quartz-engine'
          git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
          
          # Mover archivos de Quartz a la raíz sin borrar los tuyos
          cp -rn quartz-engine/* .
          rm -rf quartz-engine
          
          # Instalar dependencias de Quartz y el parseador de CSV
          npm install
          npm install csv-parse

      - name: Descargar de Sheets y generar Markdown
        run: node build-garden.js

      - name: Compilar Quartz
        run: npx quartz build

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
