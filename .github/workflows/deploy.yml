name: Actualizar y Desplegar Jardín

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clonar motor de Quartz si falta package.json
        run: |
          if [ ! -f "package.json" ]; then
            echo "package.json no detectado. Obteniendo motor de Quartz..."
            git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
            shopt -s dotglob
            cp -r quartz-engine/* .
            rm -rf quartz-engine
          fi

      - name: Instalar dependencias del proyecto
        run: |
          npm ci || npm install
          npm install csv-parse

      - name: Limpiar contenido previo para modo test
        run: |
          rm -rf content/*
          rm -rf public
          rm -rf .quartz-cache

      - name: Descargar de Sheets y generar Markdown
        run: node build_test.js

      - name: Fijar baseUrl en la configuración YAML
        run: |
          for f in quartz.config.yaml quartz.config.yml quartz.config.default.yaml; do
            if [ -f "$f" ]; then
              sed -i -E 's|^([[:space:]]*baseUrl:).*|\1 HanakoMatcha.github.io/Kanji_Garden|' "$f"
              echo "== $f =="
              grep -n "baseUrl" "$f" || true
            fi
          done

      - name: Fijar paleta de colores en el YAML
        run: |
          f=quartz.config.default.yaml
          setc() { sed -i -E "$1 s|^([[:space:]]*)$2:.*|\1$2: $3|" "$f"; }

          # Modo claro: matcha y rosa pastel
          L='/^[[:space:]]*lightMode:/,/^[[:space:]]*darkMode:/'
          setc "$L" light '"#fdf8f6"'
          setc "$L" lightgray '"#f3dfe3"'
          setc "$L" gray '"#b7c4a8"'
          setc "$L" darkgray '"#5f6b55"'
          setc "$L" dark '"#3b4636"'
          setc "$L" secondary '"#6f9560"'
          setc "$L" tertiary '"#f2a7c3"'
          setc "$L" highlight 'rgba(242, 167, 195, 0.2)'
          setc "$L" textHighlight '"#f9d5e588"'

          # Modo oscuro: negro y neones
          D='/^[[:space:]]*darkMode:/,/^plugins:/'
          setc "$D" light '"#0a0a0c"'
          setc "$D" lightgray '"#222228"'
          setc "$D" gray '"#5a5a66"'
          setc "$D" darkgray '"#c9c9d6"'
          setc "$D" dark '"#f2f2f7"'
          setc "$D" secondary '"#5dff9a"'
          setc "$D" tertiary '"#ff4fd8"'
          setc "$D" highlight 'rgba(255, 79, 216, 0.15)'
          setc "$D" textHighlight '"#5dff9a55"'

      - name: Ver qué cambió en el YAML
        run: git diff quartz.config.default.yaml || true

      - name: Compilar Quartz
        run: npx quartz build

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
