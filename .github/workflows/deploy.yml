name: Actualizar y Desplegar Jardín

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

# Permisos necesarios para escribir en GitHub Pages
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar dependencias
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"jardin-kanji","type":"module"}' > package.json
          fi
          npm install csv-parse @jackyzha0/quartz

      - name: Generar archivos Markdown desde Google Sheets
        run: node build-garden.js

      - name: Compilar Quartz
        run: npx quartz build

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
