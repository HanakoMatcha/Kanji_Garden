name: Actualizar y Desplegar Jardín

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar tu repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clonar motor de Quartz si no existe
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
          cp -rn quartz-engine/* .
          rm -rf quartz-engine

      - name: Caché de dependencias npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependencias
        run: |
          npm install
          npm install csv-parse

      - name: Caché de Quartz (Build & AST)
        uses: actions/cache@v4
        with:
          path: |
            .quartz-cache
            public
          key: ${{ runner.os }}-quartz-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quartz-

      - name: Limpiar contenido previo para modo test
        run: rm -rf content/*

      - name: Descargar de Sheets y generar Markdown
        run: node build_test.js

      - name: Compilar Quartz
        run: npx quartz build

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
