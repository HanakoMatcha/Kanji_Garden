name: Actualizar y Desplegar Jardín

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clonar motor de Quartz si falta package.json
        run: |
          if [ ! -f "package.json" ]; then
            echo "package.json no detectado. Obteniendo motor de Quartz..."
            git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
            shopt -s dotglob
            cp -r quartz-engine/* .
            rm -rf quartz-engine
          fi

      - name: Instalar dependencias del proyecto
        run: |
          npm ci || npm install
          npm install csv-parse

      - name: Limpiar contenido previo para modo test
        run: |
          rm -rf content/*
          rm -rf public
          rm -rf .quartz-cache

      - name: Descargar de Sheets y generar Markdown
        run: node build_test.js

      - name: Fijar baseUrl en la configuración YAML
        run: |
          for f in quartz.config.yaml quartz.config.yml quartz.config.default.yaml; do
            if [ -f "$f" ]; then
              sed -i -E 's|^([[:space:]]*baseUrl:).*|\1 HanakoMatcha.github.io/Kanji_Garden|' "$f"
              echo "== $f =="
              grep -n "baseUrl" "$f" || true
            fi
          done
      
      - name: Fijar paleta de colores en el YAML
        run: |
          f=quartz.config.default.yaml
          setc() { sed -i -E "$1 s|^([[:space:]]*)$2:.*|\1$2: $3|" "$f"; }

          L='/lightMode:/,/darkMode:/'
          setc "$L" light '"#f7f5ee"'
          setc "$L" lightgray '"#e3e6d8"'
          setc "$L" gray '"#a9b39b"'
          setc "$L" darkgray '"#4a5a45"'
          setc "$L" dark '"#2a3328"'
          setc "$L" secondary '"#5b7f4f"'
          setc "$L" tertiary '"#9bb585"'
          setc "$L" highlight 'rgba(91, 127, 79, 0.15)'
          setc "$L" textHighlight '"#e8e06088"'

          D='/darkMode:/,/^plugins:/'
          setc "$D" light '"#1a1f18"'
          setc "$D" lightgray '"#2e3629"'
          setc "$D" gray '"#5c6b55"'
          setc "$D" darkgray '"#cdd6c4"'
          setc "$D" dark '"#eef2e8"'
          setc "$D" secondary '"#9bbf8a"'
          setc "$D" tertiary '"#c4d6a8"'
          setc "$D" highlight 'rgba(155, 191, 138, 0.15)'
          setc "$D" textHighlight '"#b3aa0288"'

          grep -n -A 22 "colors:" "$f"
        
      - name: Compilar Quartz
        run: npx quartz build

      - name: Comprobar basepath generado
        run: |
          grep -o 'data-basepath="[^"]*"' public/index.html | head -1 || echo "sin data-basepath"
          grep -o 'data-basepath="[^"]*"' public/kanji/index.html | head -1 || true

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
