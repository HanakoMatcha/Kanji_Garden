name: Actualizar y Desplegar Jardín

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Reconstruir aunque las hojas no hayan cambiado"
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

# Cancela ejecuciones en cola u obsoletas si se dispara una nueva
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versión del motor de Quartz (rama, tag o commit). Pon aquí un commit concreto
  # para que un cambio en Quartz no rompa tu build de un día para otro.
  QUARTZ_REF: 97a2d05f80c4c50534959b1d0d41cc4b3895625e

jobs:
  # ---------------------------------------------------------------
  # 1) Revisar si hay algo nuevo que publicar (tarda segundos)
  # ---------------------------------------------------------------
  revisar:
    runs-on: ubuntu-latest
    outputs:
      construir: ${{ steps.decidir.outputs.construir }}
      clave: ${{ steps.hojas.outputs.clave }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Calcular huella de las hojas y del código
        id: hojas
        run: |
          set -eo pipefail
          # URLs de Google Sheets escritas en build_test.js
          urls=$(grep -ohE 'https://docs\.google\.com/spreadsheets/[A-Za-z0-9/_?=&.%-]+' build_test.js | sort -u || true)
          huella="sin-huella-${{ github.run_id }}"
          if [ -n "$urls" ]; then
            huella=$(
              for u in $urls; do
                curl -fsSL --retry 3 "$u" | sha256sum
              done | sha256sum | cut -d' ' -f1
            ) || huella="error-${{ github.run_id }}"
          fi
          codigo="${{ hashFiles('build_test.js', '.github/workflows/deploy.yml') }}"
          echo "clave=publicado-${codigo}-${huella}" >> "$GITHUB_OUTPUT"

      - name: Buscar marca de publicación previa
        id: marca
        if: ${{ !inputs.forzar }}
        uses: actions/cache/restore@v4
        with:
          path: .marca-publicado
          key: ${{ steps.hojas.outputs.clave }}
          lookup-only: true

      - name: Decidir si hay que reconstruir
        id: decidir
        run: |
          if [ "${{ steps.marca.outputs.cache-hit }}" = "true" ]; then
            echo "construir=false" >> "$GITHUB_OUTPUT"
            echo "Hojas y código sin cambios desde la última publicación: se omite la reconstrucción."
          else
            echo "construir=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------
  # 2) Generar Markdown y compilar Quartz
  # ---------------------------------------------------------------
  construir:
    needs: revisar
    if: needs.revisar.outputs.construir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clonar motor de Quartz si falta package.json
        run: |
          if [ ! -f "package.json" ]; then
            echo "package.json no detectado. Obteniendo motor de Quartz ($QUARTZ_REF)..."
            mkdir quartz-engine
            git -C quartz-engine init -q
            git -C quartz-engine remote add origin https://github.com/jackyzha0/quartz.git
            git -C quartz-engine fetch -q --depth 1 origin "$QUARTZ_REF"
            git -C quartz-engine checkout -q FETCH_HEAD
            rm -rf quartz-engine/.git
            shopt -s dotglob
            cp -r quartz-engine/* .
            rm -rf quartz-engine
          fi

      - name: Cachear descargas de npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Instalar dependencias del proyecto
        run: |
          npm ci --prefer-offline --no-audit --no-fund || npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund csv-parse

      - name: Limpiar contenido previo para modo test
        run: |
          rm -rf content/*

      - name: Descargar de Sheets y generar Markdown
        run: node build_test.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fijar baseUrl en la configuración YAML
        run: |
          for f in quartz.config.yaml quartz.config.yml quartz.config.default.yaml; do
            if [ -f "$f" ]; then
              sed -i -E 's|^([[:space:]]*baseUrl:).*|\1 HanakoMatcha.github.io/Kanji_Garden|' "$f"
              echo "== $f =="
              grep -n "baseUrl" "$f" || true
            fi
          done

      - name: Fijar título del sitio en el YAML
        run: |
          f=quartz.config.default.yaml
          sed -i -E 's|^([[:space:]]*pageTitle:).*|\1 "Kanji Garden"|' "$f"
          grep -n -i "title" "$f" | head -10 || true

      - name: Fijar paleta de colores en el YAML
        run: |
          f=quartz.config.default.yaml
          setc() { sed -i -E "$1 s|^([[:space:]]*)$2:.*|\1$2: $3|" "$f"; }

          # Modo claro: papel de ebook, café oscuro, matcha y rosa pastel
          L='/^[[:space:]]*lightMode:/,/^[[:space:]]*darkMode:/'
          setc "$L" light '"#f4ecd8"'
          setc "$L" lightgray '"#e4d8bd"'
          setc "$L" gray '"#b8a98a"'
          setc "$L" darkgray '"#5c4636"'
          setc "$L" dark '"#3e2a1e"'
          setc "$L" secondary '"#6a8f58"'
          setc "$L" tertiary '"#e993b5"'
          setc "$L" highlight 'rgba(233, 147, 181, 0.2)'
          setc "$L" textHighlight '"#f3c9d988"'

          # Modo oscuro: púrpura oscuro y neones
          D='/^[[:space:]]*darkMode:/,/^plugins:/'
          setc "$D" light '"#1b1028"'
          setc "$D" lightgray '"#2e1c42"'
          setc "$D" gray '"#6e5a8a"'
          setc "$D" darkgray '"#d8cfe8"'
          setc "$D" dark '"#f5f0fb"'
          setc "$D" secondary '"#5dff9a"'
          setc "$D" tertiary '"#ff4fd8"'
          setc "$D" highlight 'rgba(255, 79, 216, 0.15)'
          setc "$D" textHighlight '"#5dff9a55"'

      - name: Graph en carpetas y páginas de etiquetas
        run: |
          f=quartz.config.default.yaml
          sed -i '/^    folder:/,/^    canvas:/ { /^      positions:/d; /^        right: \[\]/d }' "$f"
          sed -i '/^    tag:/,/^    canvas:/ { /^      positions:/d; /^        right: \[\]/d }' "$f"
          echo "--- bloque layout resultante ---"
          sed -n '/^layout:/,$p' "$f"

      - name: Apagar imágenes de vista previa (og-image)
        run: |
          f=quartz.config.default.yaml
          echo "--- antes ---"
          grep -n -A6 'quartz-community/og-image' "$f" || true
          sed -i '/source: "@quartz-community\/og-image"/,/^  - source/ s/enabled: true/enabled: false/' "$f"
          echo "--- después ---"
          grep -n -A6 'quartz-community/og-image' "$f" || true

      - name: Ajustar opciones del graph
        run: |
          f=quartz.config.default.yaml
          sed -i '/source: "@quartz-community\/graph"/,/^  - source/ s|^    enabled: true$|    enabled: true\n    options:\n      localGraph:\n        drag: true\n        zoom: true\n        depth: 1\n        scale: 1.1\n        repelForce: 0.6\n        centerForce: 0.3\n        linkDistance: 45\n        fontSize: 0.6\n        opacityScale: 1\n        removeTags: ["kanji", "vocabulario", "radical"]\n        showTags: true\n      globalGraph:\n        drag: true\n        zoom: true\n        depth: 1\n        scale: 1.0\n        repelForce: 0.5\n        centerForce: 0.4\n        linkDistance: 50\n        fontSize: 0.5\n        opacityScale: 0.9\n        removeTags: ["kanji", "vocabulario", "radical"]\n        showTags: true|' "$f"
          echo "--- bloque del graph ---"
          grep -n -A22 'quartz-community/graph' "$f" || true

      - name: Cambiar favicon
        run: |
          if [ -f "favicon.png" ]; then
            mkdir -p quartz/static
            cp favicon.png quartz/static/icon.png
            find node_modules/@quartz-community -name "icon.png" 2>/dev/null | while read -r f; do
              cp favicon.png "$f"
              echo "Reemplazado: $f"
            done
          else
            echo "No se encontró favicon.png en la raíz del repositorio"
          fi

      - name: Inyectar estilos personalizados en custom.scss
        run: |
          mkdir -p quartz/styles
          cat << 'EOF' >> quartz/styles/custom.scss

          /* =========================================================
             LIMPIEZA DE LISTADOS AUTOMÁTICOS EN CATÁLOGOS PAGINADOS
             ========================================================= */
          /* Oculta únicamente el listado inferior dentro de los catálogos paginados, preservando /tags/ */
          body[data-slug^="kanji"] .page-listing,
          body[data-slug^="kanji"] .page-listing + ul,
          body[data-slug^="vocab"] .page-listing,
          body[data-slug^="vocab"] .page-listing + ul,
          body[data-slug^="componentes"] .page-listing,
          body[data-slug^="componentes"] .page-listing + ul {
            display: none !important;
          }

          /* Ocultar sección técnica de enlaces para el grafo */
          .seccion-oculta-grafo {
            display: none !important;
          }

          /* =========================================================
             BARRA DE PAGINACIÓN CON MENÚ DESPLEGABLE (DROPDOWN)
             ========================================================= */
          .barra-paginacion-catalogo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--lightgray);
            border-radius: 12px;
            gap: 12px;
          }

          .selector-pagina-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
          }

          .selector-pagina-dropdown {
            background: #1b1028 !important;
            color: var(--secondary) !important;
            border: 1px solid var(--secondary) !important;
            padding: 6px 14px !important;
            border-radius: 20px !important;
            font-size: 0.9rem !important;
            font-weight: bold !important;
            outline: none !important;
            cursor: pointer !important;
            box-shadow: 0 0 10px rgba(93, 255, 154, 0.25) !important;
          }

          :root[saved-theme="light"] .selector-pagina-dropdown,
          html[theme="light"] .selector-pagina-dropdown {
            background: #ffffff !important;
            color: var(--secondary) !important;
            border-color: var(--secondary) !important;
          }

          .btn-nav-catalogo {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(93, 255, 154, 0.08);
            border: 1px solid var(--secondary);
            color: var(--secondary) !important;
            text-decoration: none !important;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.2s ease;
          }

          .btn-nav-catalogo:hover {
            background: var(--secondary);
            color: var(--light) !important;
            box-shadow: 0 0 12px rgba(93, 255, 154, 0.6);
          }

          .btn-nav-desactivado {
            display: inline-block;
            padding: 6px 16px;
            color: var(--gray);
            opacity: 0.3;
            font-size: 0.88rem;
            user-select: none;
          }

          /* =========================================================
             BARRA DE FILTROS POR CATEGORÍAS (EN CABECERA)
             ========================================================= */
          .contenedor-filtros-catalogo {
            margin: 1.2rem 0;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--lightgray);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          }

          .grupo-filtro-chips {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
          }

          .etiqueta-filtro-chip {
            font-size: 0.82rem;
            font-weight: bold;
            color: var(--gray);
            min-width: 85px;
          }

          .btn-chip-filtro {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--lightgray);
            color: var(--darkgray);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.15s ease;
          }

          .btn-chip-filtro:hover {
            border-color: var(--secondary);
            color: var(--secondary);
          }

          .btn-chip-filtro.activo {
            background: var(--secondary) !important;
            border-color: var(--secondary) !important;
            color: var(--light) !important;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(93, 255, 154, 0.4);
          }

          .btn-chip-reset {
            background: transparent;
            border: 1px dashed var(--gray);
            color: var(--gray);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: auto;
          }

          /* =========================================================
             GRILLAS Y TARJETAS LIMPIAS (KANJI / RADICALES / VOCAB)
             ========================================================= */
          .grid-catalogo-kanjis {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin: 1.5rem 0;
          }

          .card-catalogo-item {
            border: 1px solid var(--lightgray);
            padding: 14px 10px;
            border-radius: 8px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            display: block;
            transition: all 0.2s ease;
          }

          .card-catalogo-item:hover {
            border-color: var(--secondary);
            background: rgba(93, 255, 154, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(93, 255, 154, 0.25);
          }

          .card-catalogo-item a,
          .card-catalogo-vocab a {
            text-decoration: none !important;
            color: inherit !important;
          }

          .glifo-item-kanji {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 4px;
          }

          .significado-item-kanji {
            font-size: 0.8rem;
            color: var(--darkgray);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }

          .grid-catalogo-vocab {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
            margin: 1.5rem 0;
          }

          .card-catalogo-vocab {
            border: 1px solid var(--lightgray);
            padding: 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s ease;
          }

          .card-catalogo-vocab:hover {
            border-color: var(--tertiary);
            background: rgba(255, 79, 216, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(255, 79, 216, 0.25);
          }

          .cabecera-card-vocab {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
          }

          .palabra-card-vocab {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--tertiary);
          }

          .kana-card-vocab {
            font-size: 0.9rem;
            color: var(--gray);
          }

          .traduccion-es-card {
            font-weight: 600;
            font-size: 1rem;
            color: var(--dark);
          }

          .glosa-multilingue {
            font-size: 0.78rem;
            color: var(--darkgray);
            opacity: 0.85;
            line-height: 1.4;
            margin-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 6px;
          }

          /* =========================================================
             ESTILOS GENERALES Y GLIFOS HISTÓRICOS
             ========================================================= */
          .seccion-escritura, .contenedor-imagenes {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin: 1.2rem 0;
          }

          .seccion-escritura img, .img-estilo, .img-origen {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 0 !important;
            mix-blend-mode: multiply;
            transition: opacity 0.2s ease;
            display: inline-block;
            height: auto;
          }

          .img-estilo {
            max-width: 130px;
          }

          .img-origen {
            max-width: 100% !important;
            width: auto;
            min-width: min(100%, 320px);
            display: block;
            margin: 0.5rem 0 !important;
          }

          :root[saved-theme="dark"] .seccion-escritura img,
          :root[saved-theme="dark"] .img-estilo,
          :root[saved-theme="dark"] .img-origen,
          html[theme="dark"] .seccion-escritura img,
          html[theme="dark"] .img-estilo,
          html[theme="dark"] .img-origen,
          body.dark .seccion-escritura img,
          [data-theme="dark"] .seccion-escritura img {
            filter: invert(1) contrast(1.1) !important;
            mix-blend-mode: screen !important;
            background: transparent !important;
            border: none !important;
          }

          .graph {
            border: none !important;
            background: transparent !important;
            padding: 0 !important;
            overflow: visible !important;
          }

          .graph > h3 {
            margin: 0 0 0.5rem 0 !important;
            font-size: 1rem !important;
          }

          .graph > .graph-outer {
            box-sizing: border-box !important;
            width: 100% !important;
            height: 260px !important;
            border: 1px solid var(--lightgray) !important;
            border-radius: 8px !important;
            background: rgba(0, 0, 0, 0.15) !important;
            backdrop-filter: blur(3px);
            overflow: hidden !important;
            position: relative !important;
          }

          .graph > .graph-outer canvas {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
          }

          body[data-slug="index"] .toc,
          body[data-slug="index"] .content-meta {
            display: none !important;
          }

          .section-li .meta,
          .section-li time,
          .page-listing .meta,
          .page-listing time {
            display: none !important;
          }

          .card-dashboard:hover {
            border-color: var(--secondary) !important;
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.06) !important;
          }

          .chip-jlpt:hover {
            background: var(--tertiary) !important;
            color: var(--light) !important;
            box-shadow: 0 0 10px var(--tertiary);
          }

          .chip-tax:hover {
            background: var(--secondary) !important;
            color: var(--light) !important;
            box-shadow: 0 0 10px var(--secondary);
          }

          .article-title {
            font-size: 4.5rem !important;
            line-height: 1.1 !important;
            font-weight: 700 !important;
            color: var(--secondary) !important;
            text-shadow: 0 0 16px rgba(93, 255, 154, 0.4) !important;
            margin: 0.5rem 0 1rem 0 !important;
          }

          #explorer-content ul li:not(:has(button)),
          .explorer-content ul li:not(:has(button)) {
            display: none !important;
          }
          EOF

      - name: Compilar Quartz
        shell: bash
        timeout-minutes: 120
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx quartz build 2>&1 | grep -v "isn't yet tracked by git"

      - name: Optimizar tamano de contentIndex.json
        run: |
          node -e '
            const fs = require("fs");
            const p = "public/static/contentIndex.json";
            if (fs.existsSync(p)) {
              console.log("Optimizando contentIndex.json...");
              const data = JSON.parse(fs.readFileSync(p, "utf8"));
              for (const slug in data) {
                delete data[slug].content;
              }
              fs.writeFileSync(p, JSON.stringify(data));
              const tam = (fs.statSync(p).size / (1024 * 1024)).toFixed(2);
              console.log("Nuevo tamano optimizado: " + tam + " MB");
            }
          '

      - name: Comprobar graph publicado
        run: |
          echo "--- profundidad del graph (local y global) ---"
          grep -o '.\{0,10\}depth&quot;:[-0-9]*' public/index.html | head -3 || true
          echo "--- etiquetas en el graph (showTags) ---"
          grep -o 'showTags&quot;:[a-z]*' public/index.html | head -3 || true
          echo -n "graph en la página del kanji 日: "
          grep -c "graph-container" public/kanji/日.html || true

      - name: Medir tamaño del sitio
        run: |
          du -sh public || true
          find public -name "contentIndex*" -exec ls -la {} \; || true
          echo -n "páginas HTML: "; find public -name "*.html" | wc -l
          echo -n "imágenes webp: "; find public -name "*.webp" | wc -l

      - name: Empaquetar sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ---------------------------------------------------------------
  # 3) Publicar y dejar la marca para saltar la próxima si no hay cambios
  # ---------------------------------------------------------------
  desplegar:
    needs: [revisar, construir]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4

      - name: Crear marca de publicación
        run: echo ok > .marca-publicado

      - name: Guardar marca
        uses: actions/cache/save@v4
        with:
          path: .marca-publicado
          key: ${{ needs.revisar.outputs.clave }}
