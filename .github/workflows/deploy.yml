name: Actualizar y Desplegar Jardín

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

# Cancela ejecuciones en cola u obsoletas si se dispara una nueva
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clonar motor de Quartz si falta package.json
        run: |
          if [ ! -f "package.json" ]; then
            echo "package.json no detectado. Obteniendo motor de Quartz..."
            git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
            shopt -s dotglob
            cp -r quartz-engine/* .
            rm -rf quartz-engine
          fi

      - name: Instalar dependencias del proyecto
        run: |
          npm ci || npm install
          npm install csv-parse

      - name: Limpiar contenido previo para modo test
        run: |
          rm -rf content/*
          rm -rf public
          rm -rf .quartz-cache

      - name: Descargar de Sheets y generar Markdown
        run: node build_test.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fijar baseUrl en la configuración YAML
        run: |
          for f in quartz.config.yaml quartz.config.yml quartz.config.default.yaml; do
            if [ -f "$f" ]; then
              sed -i -E 's|^([[:space:]]*baseUrl:).*|\1 HanakoMatcha.github.io/Kanji_Garden|' "$f"
              echo "== $f =="
              grep -n "baseUrl" "$f" || true
            fi
          done

      - name: Fijar título del sitio en el YAML
        run: |
          f=quartz.config.default.yaml
          sed -i -E 's|^([[:space:]]*pageTitle:).*|\1 "Kanji Garden"|' "$f"
          grep -n -i "title" "$f" | head -10 || true

      - name: Fijar paleta de colores en el YAML
        run: |
          f=quartz.config.default.yaml
          setc() { sed -i -E "$1 s|^([[:space:]]*)$2:.*|\1$2: $3|" "$f"; }

          # Modo claro: papel de ebook, café oscuro, matcha y rosa pastel
          L='/^[[:space:]]*lightMode:/,/^[[:space:]]*darkMode:/'
          setc "$L" light '"#f4ecd8"'
          setc "$L" lightgray '"#e4d8bd"'
          setc "$L" gray '"#b8a98a"'
          setc "$L" darkgray '"#5c4636"'
          setc "$L" dark '"#3e2a1e"'
          setc "$L" secondary '"#6a8f58"'
          setc "$L" tertiary '"#e993b5"'
          setc "$L" highlight 'rgba(233, 147, 181, 0.2)'
          setc "$L" textHighlight '"#f3c9d988"'

          # Modo oscuro: púrpura oscuro y neones
          D='/^[[:space:]]*darkMode:/,/^plugins:/'
          setc "$D" light '"#1b1028"'
          setc "$D" lightgray '"#2e1c42"'
          setc "$D" gray '"#6e5a8a"'
          setc "$D" darkgray '"#d8cfe8"'
          setc "$D" dark '"#f5f0fb"'
          setc "$D" secondary '"#5dff9a"'
          setc "$D" tertiary '"#ff4fd8"'
          setc "$D" highlight 'rgba(255, 79, 216, 0.15)'
          setc "$D" textHighlight '"#5dff9a55"'

      - name: Graph en carpetas y páginas de etiquetas
        run: |
          f=quartz.config.default.yaml
          sed -i '/^    folder:/,/^    canvas:/ { /^      positions:/d; /^        right: \[\]/d }' "$f"
          sed -i '/^    tag:/,/^    canvas:/ { /^      positions:/d; /^        right: \[\]/d }' "$f"
          echo "--- bloque layout resultante ---"
          sed -n '/^layout:/,$p' "$f"

      - name: Apagar imágenes de vista previa (og-image)
        run: |
          f=quartz.config.default.yaml
          echo "--- antes ---"
          grep -n -A6 'quartz-community/og-image' "$f" || true
          sed -i '/source: "@quartz-community\/og-image"/,/^  - source/ s/enabled: true/enabled: false/' "$f"
          echo "--- después ---"
          grep -n -A6 'quartz-community/og-image' "$f" || true

      - name: Ajustar opciones del graph
        run: |
          f=quartz.config.default.yaml
          sed -i '/source: "@quartz-community\/graph"/,/^  - source/ s|^    enabled: true$|    enabled: true\n    options:\n      localGraph:\n        drag: true\n        zoom: true\n        depth: 1\n        scale: 1.1\n        repelForce: 0.6\n        centerForce: 0.3\n        linkDistance: 45\n        fontSize: 0.6\n        opacityScale: 1\n        removeTags: ["kanji", "vocabulario", "radical"]\n        showTags: true\n      globalGraph:\n        drag: true\n        zoom: true\n        depth: 1\n        scale: 1.0\n        repelForce: 0.5\n        centerForce: 0.4\n        linkDistance: 50\n        fontSize: 0.5\n        opacityScale: 0.9\n        removeTags: ["kanji", "vocabulario", "radical"]\n        showTags: true|' "$f"
          echo "--- bloque del graph ---"
          grep -n -A22 'quartz-community/graph' "$f" || true

      - name: Cambiar favicon
        run: |
          if [ -f "favicon.png" ]; then
            mkdir -p quartz/static
            cp favicon.png quartz/static/icon.png
            find node_modules/@quartz-community -name "icon.png" 2>/dev/null | while read -r f; do
              cp favicon.png "$f"
              echo "Reemplazado: $f"
            done
          else
            echo "No se encontró favicon.png en la raíz del repositorio"
          fi

      - name: Limitar cantidad máxima de nodos en el graph
        run: |
          TARGET=$(find . -path "*/components/scripts/graph.*" -o -path "*/components/Graph.*" 2>/dev/null | head -n 1)
          if [ -n "$TARGET" ]; then
            echo "Parcheando límite de nodos a 45 en: $TARGET"
            sed -i -E 's/(nodes\s*=\s*[^;]+);/\1.slice(0, 45);/g' "$TARGET" || true
          fi

      - name: Inyectar estilos personalizados en custom.scss
        run: |
          mkdir -p quartz/styles
          cat << 'EOF' >> quartz/styles/custom.scss

          /* --- Barra de Filtros Interactiva para Listados --- */
          .contenedor-filtros-dinamicos {
            margin: 1.5rem 0 2rem 0;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--lightgray);
            border-radius: 8px;
          }

          .grupo-filtro {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 0.6rem;
          }

          .grupo-filtro:last-child {
            margin-bottom: 0;
          }

          .etiqueta-filtro {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--gray);
            min-width: 90px;
          }

          .btn-filtro {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--lightgray);
            color: var(--darkgray);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
          }

          .btn-filtro:hover {
            border-color: var(--secondary);
            color: var(--secondary);
          }

          .btn-filtro.activo {
            background: var(--secondary) !important;
            border-color: var(--secondary) !important;
            color: var(--light) !important;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(93, 255, 154, 0.4);
          }

          .btn-limpiar-filtros {
            background: transparent;
            border: 1px dashed var(--gray);
            color: var(--gray);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: auto;
          }

          .btn-limpiar-filtros:hover {
            border-color: var(--tertiary);
            color: var(--tertiary);
          }

          .contador-resultados {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 0.8rem;
          }

          /* --- Contenedor de glifos e imágenes históricas --- */
          .seccion-escritura, .contenedor-imagenes {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin: 1.2rem 0;
          }

          /* Modo Claro: Sin bordes ni marcos; mezcla transparente sobre papel cálido */
          .seccion-escritura img, .img-estilo, .img-origen {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 0 !important;
            mix-blend-mode: multiply;
            transition: opacity 0.2s ease;
            display: inline-block;
            height: auto;
          }

          .img-estilo {
            max-width: 130px;
          }

          .img-origen {
            max-width: 100% !important;
            width: auto;
            min-width: min(100%, 320px);
            display: block;
            margin: 0.5rem 0 !important;
          }

          /* Modo Oscuro: Trazos blancos flotando directamente sobre el fondo púrpura */
          :root[saved-theme="dark"] .seccion-escritura img,
          :root[saved-theme="dark"] .img-estilo,
          :root[saved-theme="dark"] .img-origen,
          html[theme="dark"] .seccion-escritura img,
          html[theme="dark"] .img-estilo,
          html[theme="dark"] .img-origen,
          body.dark .seccion-escritura img,
          [data-theme="dark"] .seccion-escritura img {
            filter: invert(1) contrast(1.1) !important;
            mix-blend-mode: screen !important;
            background: transparent !important;
            border: none !important;
          }

          /* Ajuste estético y alineación del Graph View */
          .graph {
            border: none !important;
            background: transparent !important;
            padding: 0 !important;
            overflow: visible !important;
          }

          .graph > h3 {
            margin: 0 0 0.5rem 0 !important;
            font-size: 1rem !important;
          }

          .graph > .graph-outer {
            box-sizing: border-box !important;
            width: 100% !important;
            height: 260px !important;
            border: 1px solid var(--lightgray) !important;
            border-radius: 8px !important;
            background: rgba(0, 0, 0, 0.15) !important;
            backdrop-filter: blur(3px);
            overflow: hidden !important;
            position: relative !important;
          }

          .graph > .graph-outer canvas {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
          }

          /* Ocultar Table of Contents y metadatos en la portada */
          body[data-slug="index"] .toc,
          body[data-slug="index"] .content-meta {
            display: none !important;
          }
          /* Regla estricta para ocultar filas filtradas superando el display: grid */
          li.section-li.filtro-oculto {
            display: none !important;
          }

          /* Ocultar fechas innecesarias en listados de tags y carpetas */
          .section-li .meta,
          .section-li time,
          .page-listing .meta,
          .page-listing time {
            display: none !important;
          }

          /* Hover animado para las tarjetas del Dashboard */
          .card-dashboard:hover {
            border-color: var(--secondary) !important;
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.06) !important;
          }

          /* Hover para chips de JLPT (rosa neón) */
          .chip-jlpt:hover {
            background: var(--tertiary) !important;
            color: var(--light) !important;
            box-shadow: 0 0 10px var(--tertiary);
          }

          /* Hover para chips de Taxonomía (verde neón) */
          .chip-tax:hover {
            background: var(--secondary) !important;
            color: var(--light) !important;
            box-shadow: 0 0 10px var(--secondary);
          }

          /* Kanji Hero: Título gigante para kanjis y componentes */
          .article-title {
            font-size: 4.5rem !important;
            line-height: 1.1 !important;
            font-weight: 700 !important;
            color: var(--secondary) !important;
            text-shadow: 0 0 16px rgba(93, 255, 154, 0.4) !important;
            margin: 0.5rem 0 1rem 0 !important;
          }

          /* --- Cuadrícula tabular de 2 columnas para carpetas y tags --- */
          .section-ul {
            padding-left: 0 !important;
            list-style: none !important;
          }

          .section-li {
            display: grid !important;
            grid-template-columns: 220px 1fr !important;
            align-items: center !important;
            gap: 16px !important;
            margin-bottom: 0.75rem !important;
          }

          .section-li .section {
            display: contents !important;
          }

          .section-li .desc {
            grid-column: 1 !important;
            margin: 0 !important;
          }

          .section-li .desc a {
            font-size: 1.15rem !important;
            font-weight: 600 !important;
            display: inline-block !important;
            word-break: break-word !important;
          }

          .section-li .tags {
            grid-column: 2 !important;
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 8px !important;
            margin: 0 !important;
            padding: 0 !important;
            list-style: none !important;
            align-items: center !important;
          }

          .section-li .tags li {
            margin: 0 !important;
            padding: 0 !important;
            list-style: none !important;
          }

          .section-li .tags li::marker,
          .section-li .tags li::before {
            display: none !important;
            content: none !important;
          }

          /* --- Ocultar archivos individuales del árbol lateral para evitar saturación --- */
          #explorer-content ul li:not(:has(button)),
          .explorer-content ul li:not(:has(button)) {
            display: none !important;
          }
          EOF

      - name: Compilar Quartz
        shell: bash
        timeout-minutes: 120
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx quartz build 2>&1 | grep -v "isn't yet tracked by git"

      - name: Optimizar tamano de contentIndex.json
        run: |
          node -e '
            const fs = require("fs");
            const p = "public/static/contentIndex.json";
            if (fs.existsSync(p)) {
              console.log("Optimizando contentIndex.json...");
              const data = JSON.parse(fs.readFileSync(p, "utf8"));
              for (const slug in data) {
                delete data[slug].content;
              }
              fs.writeFileSync(p, JSON.stringify(data));
              const tam = (fs.statSync(p).size / (1024 * 1024)).toFixed(2);
              console.log("Nuevo tamano optimizado: " + tam + " MB");
            }
          '

      - name: Inyectar botones de filtro en HTML de listados y tags
        run: |
          cat << 'INJECTOR_EOF' > inyectar_filtros.cjs
          const fs = require("fs");

          const scriptFiltros = `
          <script>
          document.addEventListener("DOMContentLoaded", () => {
            function montarFiltros() {
              const lista = document.querySelector(".section-ul");
              if (!lista || document.querySelector(".contenedor-filtros-dinamicos")) return;

              const items = Array.from(lista.querySelectorAll(".section-li"));
              if (items.length === 0) return;

              const panel = document.createElement("div");
              panel.className = "contenedor-filtros-dinamicos";
              panel.innerHTML = \`
                <div class="grupo-filtro">
                  <span class="etiqueta-filtro">JLPT:</span>
                  <button type="button" class="btn-filtro" data-tag="jlpt-n5">N5</button>
                  <button type="button" class="btn-filtro" data-tag="jlpt-n4">N4</button>
                  <button type="button" class="btn-filtro" data-tag="jlpt-n3">N3</button>
                  <button type="button" class="btn-filtro" data-tag="jlpt-n2">N2</button>
                  <button type="button" class="btn-filtro" data-tag="jlpt-n1">N1</button>
                  <button type="button" class="btn-limpiar-filtros" id="btn-reset-filtros">Limpiar</button>
                </div>
                <div class="grupo-filtro">
                  <span class="etiqueta-filtro">Taxonomía:</span>
                  <button type="button" class="btn-filtro" data-tag="joyo">Jōyō</button>
                  <button type="button" class="btn-filtro" data-tag="jinmeiyo">Jinmeiyō</button>
                  <button type="button" class="btn-filtro" data-tag="kyuujitai">Kyūjitai</button>
                </div>
                <div class="contador-resultados" id="lbl-contador">Mostrando \${items.length} entradas</div>
              \`;

              lista.parentNode.insertBefore(panel, lista);

              const filtros = new Set();
              const contador = document.getElementById("lbl-contador");

              function aplicar() {
                let v = 0;
                const arr = Array.from(filtros);
                items.forEach(it => {
                  const txt = Array.from(it.querySelectorAll(".tags a, .tags li")).map(e => e.textContent.replace("#","").trim().toLowerCase());
                  const ok = arr.every(t => txt.includes(t));
                  it.style.display = ok ? "" : "none";
                  if (ok) v++;
                });
                contador.textContent = \`Mostrando \${v} entradas (de \${items.length})\`;
              }

              panel.querySelectorAll(".btn-filtro").forEach(b => {
                b.onclick = () => {
                  const tg = b.dataset.tag;
                  if (filtros.has(tg)) { filtros.delete(tg); b.classList.remove("activo"); }
                  else { filtros.add(tg); b.classList.add("activo"); }
                  aplicar();
                };
              });

              const btnReset = document.getElementById("btn-reset-filtros");
              if (btnReset) {
                btnReset.onclick = () => {
                  filtros.clear();
                  panel.querySelectorAll(".btn-filtro").forEach(b => b.classList.remove("activo"));
                  aplicar();
                };
              }
            }
            montarFiltros();
            document.addEventListener("nav", montarFiltros);
          });
          </script>
          `;

          function procesarArchivos(dir) {
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir, { withFileTypes: true });
            for (const f of files) {
              const full = dir + "/" + f.name;
              if (f.isDirectory()) {
                procesarArchivos(full);
              } else if (f.name === "index.html") {
                let html = fs.readFileSync(full, "utf8");
                if (html.includes("section-ul") && !html.includes("contenedor-filtros-dinamicos")) {
                  html = html.replace("</body>", scriptFiltros + "</body>");
                  fs.writeFileSync(full, html);
                  console.log("Filtros inyectados en: " + full);
                }
              }
            }
          }

          procesarArchivos("public/vocab");
          procesarArchivos("public/kanji");
          procesarArchivos("public/tags");
          INJECTOR_EOF

          node inyectar_filtros.cjs
          rm inyectar_filtros.cjs
          
      - name: Comprobar graph publicado
        run: |
          echo "--- profundidad del graph (local y global) ---"
          grep -o '.\{0,10\}depth&quot;:[-0-9]*' public/index.html | head -3 || true
          echo "--- etiquetas en el graph (showTags) ---"
          grep -o 'showTags&quot;:[a-z]*' public/index.html | head -3 || true
          echo -n "graph en la página del kanji 日: "
          grep -c "graph-container" public/kanji/日.html || true

      - name: Medir tamaño del sitio
        run: |
          du -sh public || true
          find public -name "contentIndex*" -exec ls -la {} \; || true
          echo -n "páginas HTML: "; find public -name "*.html" | wc -l
          echo -n "imágenes webp: "; find public -name "*.webp" | wc -l

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
